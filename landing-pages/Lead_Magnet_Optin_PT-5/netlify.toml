[build]
  publish = "."
  functions = "netlify/functions"

# Rate limiting: throttles bursty automated traffic (e.g. the scraper
# cycling through spoofed/obsolete user agents seen in the request log)
# without affecting normal browsing — a real visitor's page load never
# comes close to this threshold. Netlify caps window_size at 180s, so this
# guards against bursts, not slow trickling scrapes.
#
# Doesn't cover /.netlify/functions/subscribe: that path is a reserved
# routing namespace and can't be targeted by a redirect rule (Netlify
# rejects it at deploy time). A function-level rate limit is possible but
# only via the modern ESM function config, which subscribe.js doesn't use
# (CommonJS exports.handler) — left as-is since the honeypot/origin-check/
# server-verified Turnstile already in that function is the layer that
# actually stops fake signups, and no abuse of that endpoint has been seen.
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 30
    window_size = 60
    aggregate_by = ["ip", "domain"]
