[build]
  publish = "."
  functions = "netlify/functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- :/landing-pages/Lead_Magnet_Optin_PT-5"

# Rate limiting: throttles bursty automated traffic (e.g. the scraper
# cycling through spoofed/obsolete user agents seen in the request log)
# without affecting normal browsing. Netlify caps window_size at 180s, so
# this guards against bursts, not slow trickling scrapes.
#
# This DOES cover /.netlify/functions/subscribe too — "/*" matches it as a
# source pattern regardless of the reserved-namespace restriction on
# redirect targets. (A previous version of this comment assumed otherwise
# and set window_limit=30, which a single real page load — fonts, hero
# video, ~8 images — comes close to on its own, occasionally 429-ing a
# genuine visitor's form submit. 150 leaves headroom for a couple of page
# loads plus the submit.) subscribe.js has its own tighter, IP-scoped
# best-effort limit on top of this — see the comment there.
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 150
    window_size = 60
    aggregate_by = ["ip", "domain"]
