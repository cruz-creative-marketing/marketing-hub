[build]
  publish = "bio"
  # Skip the build when nothing the bio site uses has changed.
  # When Netlify has no build cache, CACHED_COMMIT_REF equals COMMIT_REF, so comparing them
  # always says "no change" and cancels the deploy (this blocked PRs #20 to #22).
  # In that case compare with the previous commit instead (for a PR merge, all of main before it).
  ignore = "BASE=$CACHED_COMMIT_REF; if [ -z \"$BASE\" ] || [ \"$BASE\" = \"$COMMIT_REF\" ]; then BASE=$COMMIT_REF^; fi; git diff --quiet $BASE $COMMIT_REF -- :/bio :/netlify.toml :/netlify/edge-functions"
  # Edge function that keeps the bio page's latest case study card current (PT-129)
  edge_functions = "netlify/edge-functions"

[[redirects]]
  from = "/"
  to = "/bio-cruz-creative.html"
  status = 200
