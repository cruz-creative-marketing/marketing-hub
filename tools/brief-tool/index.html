<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cruz Creative - Brief Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #15171C;
      color: #ffffff;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #4FE3A0;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #aaaaaa;
      margin-bottom: 32px;
      font-size: 15px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4FE3A0;
      margin-bottom: 6px;
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      background: #1e2028;
      border: 1px solid #2e3040;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
      font-family: 'Segoe UI', sans-serif;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #4FE3A0;
    }
    textarea { resize: vertical; min-height: 80px; }
    .btn {
      margin-top: 32px;
      width: 100%;
      padding: 16px;
      background: #EC1E79;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .output-section {
      margin-top: 48px;
      display: none;
    }
    .output-section h2 {
      font-size: 20px;
      color: #4FE3A0;
      margin-bottom: 16px;
    }
    .brief-output {
      background: #1e2028;
      border: 1px solid #2e3040;
      border-radius: 8px;
      padding: 24px;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .button-row {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .copy-btn {
      padding: 12px 24px;
      background: #4FE3A0;
      color: #15171C;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }
    .pdf-btn {
      padding: 12px 24px;
      background: #EC1E79;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 32px;
      color: #4FE3A0;
      font-size: 16px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #2e3040;
      border-top-color: #4FE3A0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #3a1a2a;
      border: 1px solid #EC1E79;
      border-radius: 8px;
      color: #EC1E79;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Cruz Creative</div>
    <h1>Brief Generator</h1>
    <p class="subtitle">Fill in the details below and get a production-ready creative brief in seconds.</p>

    <label>Brand Name</label>
    <input type="text" id="brand" placeholder="e.g. Bloom Skincare" />

    <label>Product or Service Being Promoted</label>
    <input type="text" id="product" placeholder="e.g. New SPF moisturiser launch" />

    <label>Target Audience</label>
    <textarea id="audience" placeholder="e.g. Women 28-45, interested in clean beauty, frustrated with products that don't deliver"></textarea>

    <label>Platform</label>
    <select id="platform">
      <option value="">Select a platform</option>
      <option>Instagram Reels</option>
      <option>TikTok</option>
      <option>Facebook</option>
      <option>LinkedIn</option>
      <option>YouTube Shorts</option>
      <option>Multiple platforms</option>
    </select>

    <label>Campaign Goal</label>
    <select id="goal">
      <option value="">Select a goal</option>
      <option>Brand Awareness</option>
      <option>Lead Generation</option>
      <option>Direct Sales</option>
      <option>Engagement and Community</option>
      <option>Product Launch</option>
    </select>

    <label>Tone of Voice (3 words)</label>
    <input type="text" id="tone" placeholder="e.g. Bold, warm, trustworthy" />

    <label>References or Inspiration</label>
    <textarea id="references" placeholder="e.g. Links, competitor accounts, or describe a style you love"></textarea>

    <label>Go-Live Date or Deadline</label>
    <input type="text" id="deadline" placeholder="e.g. 14 July 2025" />

    <label>Hard Restrictions (what to avoid)</label>
    <textarea id="restrictions" placeholder="e.g. No before/after imagery, avoid price mentions, no competitor name drops"></textarea>

    <button class="btn" onclick="generateBrief()">Generate My Brief</button>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      Generating your brief, please wait...
    </div>
    <div class="error" id="error"></div>

    <div class="output-section" id="outputSection">
      <h2>Your Creative Brief</h2>
      <div class="brief-output" id="briefOutput"></div>
      <div class="button-row">
        <button class="copy-btn" onclick="copyBrief()">Copy to Clipboard</button>
        <button class="pdf-btn" onclick="downloadPDF()">Download PDF</button>
      </div>
    </div>
  </div>

  <script>
    async function generateBrief() {
      const brand = document.getElementById('brand').value.trim();
      const product = document.getElementById('product').value.trim();
      const audience = document.getElementById('audience').value.trim();
      const platform = document.getElementById('platform').value;
      const goal = document.getElementById('goal').value;
      const tone = document.getElementById('tone').value.trim();
      const references = document.getElementById('references').value.trim();
      const deadline = document.getElementById('deadline').value.trim();
      const restrictions = document.getElementById('restrictions').value.trim();

      if (!brand || !product || !audience || !platform || !goal) {
        showError("Please fill in at least the first five fields before generating.");
        return;
      }

      const btn = document.querySelector('.btn');
      btn.disabled = true;
      document.getElementById('loading').style.display = 'block';
      document.getElementById('error').style.display = 'none';
      document.getElementById('outputSection').style.display = 'none';

      const userMessage = `
Brand: ${brand}
Product or Service: ${product}
Target Audience: ${audience}
Platform: ${platform}
Campaign Goal: ${goal}
Tone of Voice: ${tone || 'Not specified'}
References: ${references || 'None provided'}
Deadline: ${deadline || 'Not specified'}
Restrictions: ${restrictions || 'None provided'}
      `.trim();

      try {
        const response = await fetch("/.netlify/functions/claude", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "claude-sonnet-5",
            max_tokens: 1500,
            system: `You are a senior creative strategist at a social media video agency.
Your job is to turn raw client input into a clean, actionable creative brief that a video editor or content creator can pick up and execute without any further clarification.

Output the brief using exactly these section headings in this order:
PROJECT OVERVIEW
TARGET AUDIENCE PROFILE
CREATIVE DIRECTION
CONTENT REQUIREMENTS
KEY MESSAGE
HOOKS TO EXPLORE (list 3)
DO NOT INCLUDE
NEXT STEPS

Rules:
- Be direct and specific
- Use short punchy sentences
- No filler language or fluff
- Each section should be 2 to 5 lines maximum
- Hooks should be opening lines a viewer would hear in the first 3 seconds of a video`,
            messages: [{ role: "user", content: userMessage }]
          })
        });

        const data = await response.json();

        if (data.error) {
          showError("API error: " + data.error.message);
          return;
        }

        const briefText = data.content[0].text;
        document.getElementById('briefOutput').textContent = briefText;
        document.getElementById('outputSection').style.display = 'block';
        document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });

        sendToSlack(brand, product, platform, goal, deadline, briefText);

      } catch (err) {
        showError("Something went wrong. Please try again. Error: " + err.message);
      } finally {
        btn.disabled = false;
        document.getElementById('loading').style.display = 'none';
      }
    }

    async function sendToSlack(brand, product, platform, goal, deadline, briefText) {
      try {
        await fetch("/.netlify/functions/claude", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            type: "slack_notification",
            brand: brand,
            product: product,
            platform: platform,
            goal: goal,
            deadline: deadline,
            briefText: briefText
          })
        });
      } catch (err) {
        console.warn("Slack notification failed:", err.message);
      }
    }

    function copyBrief() {
      const text = document.getElementById('briefOutput').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy to Clipboard', 2000);
      });
    }

    function downloadPDF() {
      const briefText = document.getElementById('briefOutput').textContent;
      const brand = document.getElementById('brand').value.trim();

      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <html>
          <head>
            <title>Creative Brief - ${brand}</title>
            <style>
              body {
                font-family: 'Segoe UI', sans-serif;
                max-width: 700px;
                margin: 40px auto;
                padding: 40px;
                color: #15171C;
                line-height: 1.7;
              }
              .header {
                border-bottom: 3px solid #4FE3A0;
                padding-bottom: 16px;
                margin-bottom: 32px;
              }
              .agency {
                color: #EC1E79;
                font-weight: 700;
                font-size: 13px;
                letter-spacing: 2px;
                text-transform: uppercase;
              }
              h1 { font-size: 24px; margin: 4px 0 0; }
              pre {
                white-space: pre-wrap;
                font-family: 'Segoe UI', sans-serif;
                font-size: 14px;
                line-height: 1.7;
              }
              .footer {
                margin-top: 48px;
                padding-top: 16px;
                border-top: 1px solid #eee;
                font-size: 12px;
                color: #999;
              }
            </style>
          </head>
          <body>
            <div class="header">
              <div class="agency">CRUZ CREATIVE</div>
              <h1>Creative Brief: ${brand}</h1>
            </div>
            <pre>${briefText}</pre>
            <div class="footer">Produced by Cruz Creative - cruzcreative.net</div>
          </body>
        </html>
      `);
      printWindow.document.close();
      printWindow.focus();
      setTimeout(() => {
        printWindow.print();
        printWindow.close();
      }, 500);
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('loading').style.display = 'none';
      document.querySelector('.btn').disabled = false;
    }
  </script>
</body>
</html>
